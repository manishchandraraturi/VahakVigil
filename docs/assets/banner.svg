<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">VahakVigil</title>
  <desc id="d">A rider is detected crashing by motion sensors, a countdown starts, and an alert with location reaches a phone. Your ride. Your safety net.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070A"/><stop offset="1" stop-color="#0E1218"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.30"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E7681"/><stop offset="0.35" stop-color="#FF5A36"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A22"/><stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0"/><stop offset="0.5" stop-color="#FF3B30" stop-opacity="0.9"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="480" fill="url(#bg)"/>
  <rect width="1400" height="480" fill="url(#glow)"/>
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="640" cy="60" r="1.5"/><circle cx="760" cy="95" r="1"/><circle cx="905" cy="48" r="1.5"/>
    <circle cx="1010" cy="88" r="1"/><circle cx="1150" cy="52" r="1.5"/><circle cx="1330" cy="90" r="1"/>
    <circle cx="300" cy="50" r="1"/><circle cx="470" cy="80" r="1.5"/><circle cx="120" cy="90" r="1"/>
  </g>

  <!-- road -->
  <rect x="0" y="365" width="1400" height="115" fill="url(#road)"/>
  <rect x="0" y="364" width="1400" height="3" fill="url(#edge)"/>
  <line x1="0" y1="425" x2="1400" y2="425" stroke="#FF3B30" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="34 26">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- title block -->
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="66" y="168" font-size="15" font-weight="700" letter-spacing="4" fill="#FF3B30">ROAD SAFETY  ·  CRASH RESPONSE PROTOTYPE</text>
    <text x="62" y="250" font-size="78" font-weight="800" fill="#FFFFFF">Vahak<tspan fill="#FF3B30">Vigil</tspan></text>
    <text x="66" y="300" font-size="30" font-weight="500" fill="#C9D1D9">Your ride. Your safety net.</text>
    <text x="66" y="336" font-size="18" fill="#8B949E">Spots a possible crash. Alerts your people.</text>
  </g>

  <!-- step labels -->
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8B949E" text-anchor="middle">
    <text x="680" y="150"><tspan fill="#FF3B30">01</tspan> RIDE</text>
    <text x="890" y="150"><tspan fill="#FF3B30">02</tspan> DETECT</text>
    <text x="1070" y="150"><tspan fill="#FF3B30">03</tspan> COUNTDOWN</text>
    <text x="1270" y="150"><tspan fill="#FF3B30">04</tspan> ALERT</text>
  </g>

  <!-- 01 rider -->
  <g transform="translate(570 235) scale(0.85)">
    <polygon points="182,66 300,28 300,104" fill="url(#beam)"/>
    <circle cx="40" cy="110" r="34" fill="#05070A" stroke="#E6EDF3" stroke-width="7"/>
    <circle cx="190" cy="110" r="34" fill="#05070A" stroke="#E6EDF3" stroke-width="7"/>
    <circle cx="40" cy="110" r="9" fill="none" stroke="#FF3B30" stroke-width="4"/>
    <circle cx="190" cy="110" r="9" fill="none" stroke="#FF3B30" stroke-width="4"/>
    <g fill="none" stroke="#C9D1D9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 110 L92 84 L150 88 L190 110" stroke-width="7"/>
      <path d="M158 56 L190 110" stroke-width="8"/>
      <path d="M148 52 L168 48" stroke-width="6"/>
    </g>
    <rect x="100" y="88" width="46" height="24" rx="5" fill="#1F2630" stroke="#8B949E" stroke-width="3"/>
    <path d="M88 70 Q118 44 156 60 L150 84 L92 86 Z" fill="#FF3B30"/>
    <path d="M50 74 Q70 64 94 70 L94 82 L54 84 Z" fill="#1F2630" stroke="#C9D1D9" stroke-width="3"/>
    <g fill="none" stroke="#E6EDF3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M86 70 L122 92 L108 114" stroke-width="11"/>
      <path d="M80 70 L112 36" stroke-width="18"/>
      <path d="M112 40 L152 54" stroke-width="9"/>
    </g>
    <circle cx="122" cy="20" r="15" fill="#E6EDF3"/>
    <path d="M124 12 Q141 14 138 27 L124 27 Z" fill="#FF3B30"/>
    <circle cx="178" cy="66" r="7" fill="#FFF4D6"/>
  </g>

  <!-- 02 impact waveform -->
  <g>
    <line x1="800" y1="270" x2="960" y2="270" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M800 270 L815 268 L825 273 L835 266 L845 275 L855 270 L866 200 L876 340 L886 226 L896 304 L906 256 L916 284 L926 266 L936 273 L960 270"
          fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="866" y1="180" x2="866" y2="350" stroke="#FF3B30" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 5"/>
    <circle cx="866" cy="200" r="6" fill="#FF3B30">
      <animate attributeName="r" values="6;13;6" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="866" cy="200" r="4" fill="#FFFFFF"/>
  </g>

  <!-- connectors -->
  <g fill="#FF3B30">
    <circle cx="976" cy="270" r="3"/><circle cx="988" cy="270" r="3" opacity="0.7"/><circle cx="1000" cy="270" r="3" opacity="0.4"/>
  </g>

  <!-- 03 countdown ring -->
  <g>
    <circle cx="1070" cy="270" r="52" fill="none" stroke="#FF3B30" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="52;74" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="270" r="48" fill="#0D1117" stroke="#2A313C" stroke-width="9"/>
    <circle cx="1070" cy="270" r="48" fill="none" stroke="#FF3B30" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="226 302" transform="rotate(-90 1070 270)"/>
    <text x="1070" y="288" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FF3B30">!</text>
    <rect x="1028" y="334" width="84" height="28" rx="14" fill="#0D1117" stroke="#6E7681" stroke-width="1.5"/>
    <text x="1070" y="353" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#C9D1D9">I'M OK</text>
  </g>

  <!-- packets to phone -->
  <g fill="#FF3B30">
    <circle cx="1140" cy="270" r="3.5"><animate attributeName="cx" values="1128;1214" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="270" r="3.5"><animate attributeName="cx" values="1128;1214" dur="1.6s" begin="0.53s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.53s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="270" r="3.5"><animate attributeName="cx" values="1128;1214" dur="1.6s" begin="1.06s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="1.06s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 04 phone with alert and location -->
  <g>
    <g fill="none" stroke="#FF3B30" stroke-linecap="round" stroke-width="3">
      <path d="M1250 172 Q1270 154 1290 172" opacity="0.9"/>
      <path d="M1240 164 Q1270 138 1300 164" opacity="0.45"/>
    </g>
    <rect x="1228" y="185" width="84" height="172" rx="16" fill="#0D1117" stroke="#3B4452" stroke-width="3"/>
    <rect x="1259" y="192" width="22" height="4" rx="2" fill="#2A313C"/>
    <rect x="1238" y="210" width="64" height="58" rx="9" fill="#3A0D0A" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="1250" cy="224" r="4" fill="#FF3B30"/>
    <rect x="1258" y="221" width="36" height="6" rx="3" fill="#F0F6FC"/>
    <rect x="1248" y="238" width="46" height="4" rx="2" fill="#8B949E"/>
    <rect x="1248" y="248" width="34" height="4" rx="2" fill="#8B949E"/>
    <path d="M1270 336 C1255 316 1251 308 1251 300 A19 19 0 1 1 1289 300 C1289 308 1285 316 1270 336 Z" fill="#FF3B30"/>
    <circle cx="1270" cy="300" r="6.5" fill="#FFFFFF"/>
  </g>
</svg>
